[project]
name = "lens-mcp"
version = "0.1.0"
description = "Lens MCP server — call analysis tools for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
lens-mcp = "lens_mcp.server:main"

[tool.setuptools]
packages = ["lens_mcp"]
