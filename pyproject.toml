[project]
name = "lens-mcp"
version = "0.3.5"
description = "Lens MCP server — call analysis tools for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
lens-mcp = "lens_mcp.server:main"

[tool.setuptools]
packages = ["lens_mcp"]

[dependency-groups]
dev = ["ruff>=0.13"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET"]
ignore = [
    # Docstrings are tool descriptions the model reads; unicode dashes and arrows are deliberate.
    "RUF001", "RUF002", "RUF003",
    # `ruff format` owns code line length; rewrapping docstrings would change tool descriptions.
    "E501",
]
